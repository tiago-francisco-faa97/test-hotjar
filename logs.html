<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Hotjar Tracking Code for Site 6372873 (name missing) -->
  
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>📄 System Logs</h2>
      <a href="index.html" class="btn btn-outline-primary">⬅ Back to Products</a>
    </div>

    <div class="mb-3">
      <button class="btn btn-outline-danger me-2" onclick="simulateError('refresh')">🔄 Refresh Logs</button>
      <button class="btn btn-outline-warning" onclick="simulateError('export')">⬇ Export Logs</button>
    </div>

    <div class="alert alert-info">
      <strong>Logs:</strong> (Simulated)
      <ul class="mt-2 mb-0">
        <li>Product added: "Example Item A"</li>
        <li>Error: Unable to connect to shipping API</li>
        <li>User edited product: "Test Item"</li>
      </ul>
    </div>
  </div>

  <script>
    function simulateError(action) {
      alert(`Oops! "${action}" is not available in demo mode.`);
    }
  </script>
</body>
</html>
